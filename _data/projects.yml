- title: Cell network deterioration
  funder: Morgan Advanced Studies Institute (MASI) Summit project
  amount: £30,000
  role: PI
  year: 2023
  summary: >-
    A framework for describing the behaviour and influence of single
    cells in multicellular populations, starting from single heart
    cells and moving to the features and interactions that emerge when
    they synchronise in a network. Collaborators: Prof Christopher
    George, Dr Hassan Eshkiki, Dr Nikol Sullo.
  links:
    - label: Webpage
      url: >-
        https://www.swansea.ac.uk/masi/summit/#cell-network-deterioration-understanding-and-predicting-disease=is-expanded
- title: >-
    Intelligent system to improve the sustainability of oil palm crops
    through the construction of forecasting maps
  funder: Newton Fund, Royal Academy of Engineering (IAPP1\100130)
  amount: £50,000
  role: CI
  year: 2018
  partner: UNIPALMA
  summary: >-
    The oil palm is considered by the Colombian Government as one of
    the main agricultural products. This project aims to develop an
    intelligent system to improve the sustainability of this crop in
    Colombia, using novel adaptive vegetation indices obtained from
    multispectral aerial views combined with Computational
    Intelligence methods in a forecasting map, in line with
    international standards for small and medium-scale growers. The
    industry partner, Unipalma of the Llanos, validates the model in a
    real environment; the Institute of Artificial Intelligence at De
    Montfort University advises on implementing the system as a
    service; and EIA University carries out the field research on
    image capture and processing, and on implementing and validating
    the system.
  links:
    - label: Webpage
      url: https://sites.google.com/site/facaraff/research/rae2018
    - label: Project repository (Figshare)
      url: >-
        https://figshare.com/projects/Intelligent_system_to_improve_the_sustainability_of_oil_palm_crops_through_the_construction_of_forecasting_maps/64742
- title: >-
    Collaborative methodology for enhancing sustainability in rural
    communities and the use of land
  funder: >-
    Global Challenges Research Fund (GCRF) competition 2018/2019 (DMU)
  amount: £23,500
  role: PI
  year: 2019
  partner: Pontificia Universidad Javeriana (Bogotá, Colombia)
  summary: >-
    The new peace process in Colombia is providing a new lease of life
    to rural communities but raising many issues and challenges, both
    social and operational. Lands that were in no-go zones are now
    available for use but have many issues from direct effect from war
    such as land mines, to indirect such as debris, pollution and
    exhaustion. On the other hand technologisation in agriculture is
    very limited in those regions. The PUJ has a very strong social
    engagement and impact in all faculties and is working in both
    social and operational aspects to support the sustainable
    development of these communities; one of the projects involves the
    use of multiple sensors to measure the land and help optimise its
    use. Sensing land characteristic and detecting buried objects is
    very complex and no one sensor or method can achieve this
    optimally. With multiple sensors, computational intelligence based
    data fusion, analysis and decision making techniques we can
    optimise the performance of various systems.
  links:
    - label: Webpage
      url: https://sites.google.com/site/facaraff/research/gcrf18
    - label: Project repository (Figshare)
      url: >-
        https://figshare.com/projects/Collaborative_methodology_for_enhancing_sustainability_in_rural_communities_and_the_use_of_land/64511
