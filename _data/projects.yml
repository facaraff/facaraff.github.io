- title: Cell network deterioration
  funder: Morgan Advanced Studies Institute (MASI) Summit project
  amount: £30,000
  role: PI
  year: 2023
  summary: >-
    A framework for describing the behaviour and influence of single
    cells in multicellular populations, starting from single heart
    cells and moving to the features and interactions that emerge when
    they synchronise in a network. Collaborators: Prof Christopher
    George, Dr Hassan Eshkiki, Dr Nikol Sullo.
- title: Lethal wilt in oil palm
  funder: Newton Fund, Royal Academy of Engineering
  amount: £50,000
  role: CI
  year: 2018
  partner: UNIPALMA
- title: Land use in rural Colombia
  funder: GCRF competition 2018/2019 (DMU)
  amount: £23,500
  role: PI
  year: 2019
  summary: >-
    Peace-process land in rural Colombia is again available for use
    but carries the legacy of war, such as improvised landmines and
    debris, which an AI-driven sensor array system is used to detect.
